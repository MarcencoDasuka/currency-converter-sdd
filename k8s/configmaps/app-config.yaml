apiVersion: v1
kind: ConfigMap
metadata:
  name: currency-platform-config
  namespace: currency-platform
data:
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_MGMT_PORT: "15672"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  AUTH_SERVICE_URL: "http://auth-service:8081"
  RATE_SERVICE_URL: "http://rate-service:8082"
  CONVERSION_SERVICE_URL: "http://conversion-service:8083"
  ALERT_SERVICE_URL: "http://alert-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
  JWT_ACCESS_TTL_SECONDS: "3600"
  JWT_ISSUER: "currency-platform-auth"
  BNM_BASE_URL: "https://www.bnm.md/en/official_exchange_rates"
  BNM_MAX_ROLLBACK_DAYS: "7"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT: "120"
  RATE_LIMIT_AUTH: "30"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Djava.security.egd=file:/dev/./urandom"
