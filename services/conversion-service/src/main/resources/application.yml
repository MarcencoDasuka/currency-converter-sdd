server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: conversion-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/conversions_db}
    username: ${SPRING_DATASOURCE_USERNAME:conversion_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:currency_app}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5000

platform:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:currency-platform-auth}

conversion:
  rate-service-url: ${RATE_SERVICE_URL:http://rate-service:8082}
  rate-connect-timeout-seconds: ${RATE_CONNECT_TIMEOUT_SECONDS:2}
  rate-read-timeout-seconds: ${RATE_READ_TIMEOUT_SECONDS:8}
  outbox-poll-ms: ${OUTBOX_POLL_MS:1500}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /openapi.json
