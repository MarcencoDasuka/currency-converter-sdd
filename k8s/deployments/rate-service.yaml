apiVersion: apps/v1
kind: Deployment
metadata:
  name: rate-service
  namespace: currency-platform
  labels:
    app: rate-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rate-service
  template:
    metadata:
      labels:
        app: rate-service
        tier: backend
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rate-service
          image: currency-platform/rate-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/rates_db
            - name: SPRING_DATASOURCE_USERNAME
              value: rate_app
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: currency-platform-secrets
                  key: RATE_DB_PASSWORD
          envFrom:
            - configMapRef:
                name: currency-platform-config
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 144Mi
            limits:
              cpu: 500m
              memory: 448Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8082
            failureThreshold: 30
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8082
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            periodSeconds: 15
            timeoutSeconds: 3
