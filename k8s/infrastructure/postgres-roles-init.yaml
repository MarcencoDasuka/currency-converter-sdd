apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-roles-init
  namespace: currency-platform
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        job: postgres-roles-init
        tier: infra
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roles-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/init/02-configure-app-roles.sh"]
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
          envFrom:
            - secretRef:
                name: currency-platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: init-scripts
              mountPath: /init/02-configure-app-roles.sh
              subPath: 02-configure-app-roles.sh
              readOnly: true
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init-scripts
            defaultMode: 0755
