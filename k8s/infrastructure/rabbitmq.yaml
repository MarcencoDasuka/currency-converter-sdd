apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-init-script
  namespace: currency-platform
data:
  init-rabbitmq.sh: |
    #!/bin/sh
    set -eu
    BASE="http://rabbitmq:15672/api"
    until curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" "${BASE}/overview" >/dev/null 2>&1; do
      sleep 2
    done
    curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" -H "content-type:application/json" -X PUT \
      "${BASE}/exchanges/%2f/currency.events" \
      -d '{"type":"topic","durable":true,"auto_delete":false}'
    curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" -H "content-type:application/json" -X PUT \
      "${BASE}/exchanges/%2f/currency.events.dlx" \
      -d '{"type":"direct","durable":true,"auto_delete":false}'
    curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" -H "content-type:application/json" -X PUT \
      "${BASE}/queues/%2f/currency.notifications.dlq" \
      -d '{"durable":true,"auto_delete":false}'
    curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" -H "content-type:application/json" -X PUT \
      "${BASE}/queues/%2f/currency.notifications" \
      -d '{"durable":true,"auto_delete":false,"arguments":{"x-dead-letter-exchange":"currency.events.dlx","x-dead-letter-routing-key":"notifications.dead"}}'
    curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" -H "content-type:application/json" -X POST \
      "${BASE}/bindings/%2f/e/currency.events/q/currency.notifications" \
      -d '{"routing_key":"conversion.completed"}'
    curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" -H "content-type:application/json" -X POST \
      "${BASE}/bindings/%2f/e/currency.events/q/currency.notifications" \
      -d '{"routing_key":"alert.triggered"}'
    curl -sf -u "${RABBITMQ_USERNAME}:${RABBITMQ_PASSWORD}" -H "content-type:application/json" -X POST \
      "${BASE}/bindings/%2f/e/currency.events.dlx/q/currency.notifications.dlq" \
      -d '{"routing_key":"notifications.dead"}'
    echo "RabbitMQ topology initialized."
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: currency-platform
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: currency-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        tier: infra
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: currency-platform-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: currency-platform-secrets
                  key: RABBITMQ_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5672
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-init
  namespace: currency-platform
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        job: rabbitmq-init
        tier: infra
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq-init
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/init/init-rabbitmq.sh"]
          envFrom:
            - secretRef:
                name: currency-platform-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: init-script
              mountPath: /init/init-rabbitmq.sh
              subPath: init-rabbitmq.sh
              readOnly: true
      volumes:
        - name: init-script
          configMap:
            name: rabbitmq-init-script
            defaultMode: 0755
