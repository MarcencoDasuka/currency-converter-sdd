server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notifications_db}
    username: ${SPRING_DATASOURCE_USERNAME:notification_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:currency_app}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false

platform:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:currency-platform-auth}

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /openapi.json
